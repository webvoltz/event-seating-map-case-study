# Excerpt: .github/workflows/ci.yml
# Staged pipeline. Cheap, security-critical checks run first and gate the rest.
#
#   secret-scan ─┐
#                ├─> quality ───┐
#   dep-audit  ──┤              ├─> test ──> build
#                └─> commitlint ┘

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # a new push cancels the stale run

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    container: { image: ghcr.io/gitleaks/gitleaks:v8.30.1, options: --entrypoint '' }
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # full history, not just the latest commit
      - run: gitleaks git --config .gitleaks.toml --redact --verbose .

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      # ... checkout, pnpm, node 24
      - run: pnpm install --frozen-lockfile # lockfile drift fails here
      - run: pnpm audit --audit-level high

  quality:
    needs: [secret-scan, dependency-audit]
    steps:
      - run: pnpm run quality # prettier --check, eslint --max-warnings=0, tsc -b

  test:
    needs: [quality, commitlint]
    steps:
      - run: pnpm test # vitest + V8 coverage, thresholds enforced

  build:
    needs: [test]
    steps:
      - run: pnpm run build
